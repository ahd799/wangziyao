<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5">
  <title>王梓瑶 · 简历</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #2a4b7c;
      --primary-light: #3e6b9e;
      --accent: #d4a373;
      --bg: #f8f6f2;
      --surface: #ffffff;
      --text: #1f2a3a;
      --text-secondary: #4a5a6e;
      --border: #e0dcd4;
      --shadow: 0 12px 30px rgba(0, 0, 0, 0.05);
      --radius: 20px;
      --radius-sm: 10px;
      --transition: 0.2s ease;
    }

    [data-theme="dark"] {
      --bg: #1a1f2b;
      --surface: #252c3a;
      --text: #eaeef2;
      --text-secondary: #bcc3cd;
      --border: #3a4252;
      --shadow: 0 12px 30px rgba(0, 0, 0, 0.3);
      --primary: #6d8fc6;
      --primary-light: #8aabdb;
      --accent: #d4a373;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
      line-height: 1.6;
      padding: 80px 24px 40px;
      transition: background 0.2s, color 0.2s;
      scroll-behavior: smooth;
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        transition: none !important;
        animation: none !important;
      }
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 40px 32px 32px;
      transition: background 0.2s, box-shadow 0.2s;
    }

    /* 导航 */
    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      background: var(--surface);
      backdrop-filter: blur(8px);
      box-shadow: 0 2px 12px rgba(0,0,0,0.04);
      padding: 0 24px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      transition: background 0.2s;
    }

    .navbar-brand {
      font-weight: 600;
      font-size: 1.2rem;
      color: var(--primary);
      letter-spacing: 0.5px;
    }

    .navbar-links {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }

    .navbar-links a {
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 0.85rem;
      padding: 4px 8px;
      border-radius: 6px;
      transition: 0.15s;
    }

    .navbar-links a:hover {
      color: var(--primary);
      background: rgba(42, 75, 124, 0.06);
    }

    .nav-actions {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .nav-btn {
      background: transparent;
      border: none;
      font-size: 1.2rem;
      cursor: pointer;
      color: var(--text-secondary);
      padding: 4px 6px;
      border-radius: 6px;
      transition: 0.15s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .nav-btn:hover {
      background: rgba(42, 75, 124, 0.06);
      color: var(--primary);
    }

    /* Hero */
    .hero {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: flex-start;
      gap: 24px;
      margin-bottom: 32px;
      padding-bottom: 24px;
      border-bottom: 2px solid var(--border);
    }

    .hero-main {
      flex: 1;
      min-width: 260px;
    }

    .hero-main h1 {
      font-size: 2.8rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
      margin-bottom: 8px;
    }

    .hero-main .sub {
      font-size: 1rem;
      color: var(--text-secondary);
      margin-bottom: 12px;
    }

    .hero-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 12px 0 16px;
    }

    .tag {
      background: var(--primary);
      color: #fff;
      padding: 4px 14px;
      border-radius: 40px;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.3px;
    }

    .hero-contact {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin-top: 6px;
    }

    .hero-contact a {
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 0.9rem;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      border-bottom: 1px dashed transparent;
      transition: 0.15s;
    }

    .hero-contact a:hover {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }

    .hero-avatar {
      flex-shrink: 0;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      overflow: hidden;
      border: 4px solid var(--accent);
      box-shadow: var(--shadow);
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hero-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .hero-stats {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
      background: var(--bg);
      padding: 16px 24px;
      border-radius: var(--radius-sm);
      min-width: 200px;
      flex: 1 1 100%;
      margin-top: 12px;
    }

    .stat-item {
      text-align: center;
    }

    .stat-number {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--primary);
    }

    .stat-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-secondary);
    }

    /* 模块 */
    .section {
      margin-top: 36px;
    }

    .section-title {
      font-size: 1.4rem;
      font-weight: 600;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--text);
      border-left: 4px solid var(--accent);
      padding-left: 14px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 16px;
    }

    /* 卡片 */
    .card {
      background: var(--bg);
      border-radius: var(--radius-sm);
      padding: 18px 20px;
      transition: 0.2s;
      border: 1px solid transparent;
    }

    .card:hover {
      transform: translateY(-2px);
      border-color: var(--border);
      box-shadow: 0 6px 16px rgba(0,0,0,0.02);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      flex-wrap: wrap;
      margin-bottom: 6px;
    }

    .card-title {
      font-weight: 600;
      font-size: 1.05rem;
      color: var(--text);
    }

    .card-sub {
      font-size: 0.85rem;
      color: var(--text-secondary);
    }

    .card-meta {
      font-size: 0.75rem;
      color: var(--text-secondary);
      background: var(--surface);
      padding: 2px 10px;
      border-radius: 30px;
    }

    .card ul {
      list-style: none;
      margin-top: 8px;
    }

    .card ul li {
      font-size: 0.9rem;
      color: var(--text-secondary);
      padding: 4px 0 4px 18px;
      position: relative;
    }

    .card ul li::before {
      content: "▹";
      position: absolute;
      left: 0;
      color: var(--accent);
    }

    /* 标签页 */
    .tabs {
      display: flex;
      gap: 4px;
      border-bottom: 2px solid var(--border);
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .tab-btn {
      background: transparent;
      border: none;
      padding: 8px 20px;
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text-secondary);
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: 0.15s;
      border-radius: 0;
    }

    .tab-btn[aria-selected="true"] {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }

    .tab-btn:hover {
      color: var(--primary);
    }

    .tab-panel {
      display: none;
      animation: fadeIn 0.2s ease;
    }

    .tab-panel[aria-hidden="false"] {
      display: block;
    }

    @keyframes fadeIn {
      0% { opacity: 0.6; transform: translateY(6px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* 技能进度条 */
    .skill-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 16px;
      margin-bottom: 10px;
    }

    .skill-name {
      width: 120px;
      font-weight: 500;
      font-size: 0.9rem;
      color: var(--text);
    }

    .skill-bar {
      flex: 1;
      height: 6px;
      background: var(--border);
      border-radius: 10px;
      overflow: hidden;
      min-width: 80px;
    }

    .skill-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary-light), var(--primary));
      border-radius: 10px;
      width: 0%;
    }

    .skill-label {
      font-size: 0.75rem;
      color: var(--text-secondary);
      width: 36px;
    }

    /* 徽章组 */
    .badge-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 6px;
    }

    .badge {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 2px 14px;
      border-radius: 30px;
      font-size: 0.75rem;
      color: var(--text-secondary);
    }

    .badge-primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    /* 图片画廊 */
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 16px;
      margin-top: 12px;
    }

    .gallery-item {
      border-radius: var(--radius-sm);
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      border: 1px solid var(--border);
      transition: 0.2s;
      background: var(--bg);
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .gallery-item:hover {
      transform: scale(1.02);
      border-color: var(--primary);
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .gallery-item .placeholder {
      font-size: 0.7rem;
      color: var(--text-secondary);
      text-align: center;
      padding: 8px;
    }

    /* 页脚 */
    .footer {
      margin-top: 40px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      font-size: 0.75rem;
      color: var(--text-secondary);
    }

    .back-top {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 6px 18px;
      border-radius: 40px;
      font-size: 0.75rem;
      cursor: pointer;
      transition: 0.15s;
    }

    .back-top:hover {
      opacity: 0.8;
    }

    /* 打印 */
    @media print {
      body {
        background: white;
        padding: 0.4in;
        color: black;
      }
      .container {
        box-shadow: none;
        padding: 12px;
        border-radius: 0;
        background: white;
      }
      .navbar {
        display: none !important;
      }
      .back-top, .nav-actions {
        display: none !important;
      }
      .card:hover {
        transform: none !important;
        box-shadow: none !important;
      }
      .section {
        margin-top: 16px;
      }
      .hero-stats {
        background: #f4f4f4;
      }
      .skill-bar {
        background: #ddd;
      }
      .skill-fill {
        background: var(--primary) !important;
      }
      .gallery-item {
        break-inside: avoid;
        border: 1px solid #ccc;
      }
    }

    /* 响应式 */
    @media (max-width: 700px) {
      body { padding: 72px 12px 24px; }
      .container { padding: 20px 16px; }
      .hero { flex-direction: column; align-items: center; }
      .hero-main h1 { font-size: 2.2rem; }
      .grid-2 { grid-template-columns: 1fr; }
      .navbar-links a { font-size: 0.7rem; padding: 2px 4px; }
      .nav-actions .nav-btn { font-size: 1rem; }
      .stat-number { font-size: 1.4rem; }
      .tabs { gap: 0; }
      .tab-btn { padding: 6px 12px; font-size: 0.8rem; }
      .hero-avatar { width: 120px; height: 120px; }
      .gallery { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
    }

    /* 实用 */
    .mt-2 { margin-top: 12px; }
    .mb-1 { margin-bottom: 6px; }
    .flex { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
    .gap-1 { gap: 6px; }

    /* 联系方式按钮 */
    .copy-email {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2px 12px;
      font-size: 0.7rem;
      cursor: pointer;
      color: var(--text-secondary);
      transition: 0.15s;
    }
    .copy-email:hover {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
  </style>
</head>

  }

  function renderHighlights() {
    const container = document.getElementById('highlights');
    container.innerHTML = `
      <div class="section" id="highlights-anchor">
        <div class="section-title">✨ 亮点成果</div>
        <div class="grid-2">
          <div class="card"><div class="card-title">📈 学习效能</div><div>班级作业提交率提升至96%，平均分提高近10%，及格率+15%</div></div>
          <div class="card"><div class="card-title">🏆 纪律管理</div><div>月均违纪次数下降40%，获班主任书面表扬</div></div>
          <div class="card"><div class="card-title">🏠 宿舍建设</div><div>连续两学期校级优秀宿舍，融洽度98/100</div></div>
          <div class="card"><div class="card-title">🎮 项目实践</div><div>独立完成2D游戏及简历视觉设计，好评率90%</div></div>
        </div>
      </div>
    `;
  }

  function renderExperience() {
    const container = document.getElementById('experience');
    const exp = resume.experiences;
    let html = `<div class="section" id="experience-anchor"><div class="section-title">💼 工作与校园经历</div>`;
    html += `<div class="tabs" role="tablist">`;
    exp.forEach((e, i) => {
      const label = e.title.length > 12 ? e.title.slice(0,10)+'…' : e.title;
      html += `<button class="tab-btn" role="tab" aria-selected="${i===0?'true':'false'}" aria-controls="exp-panel-${i}" id="exp-tab-${i}" data-index="${i}">${label}</button>`;
    });
    html += `</div>`;
    exp.forEach((e, i) => {
      html += `<div class="tab-panel" role="tabpanel" id="exp-panel-${i}" aria-labelledby="exp-tab-${i}" aria-hidden="${i!==0}">`;
      html += `<div class="card"><div class="card-header"><span class="card-title">${e.title}</span><span class="card-meta">${e.org}</span></div><div class="card-sub" style="margin-bottom:6px;">${e.period}</div><ul>`;
      e.points.forEach(p => html += `<li>${p}</li>`);
      html += `</ul></div></div>`;
    });
    html += `</div>`;
    container.innerHTML = html;

    document.querySelectorAll('#experience .tab-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        const parent = this.closest('.section');
        const btns = parent.querySelectorAll('.tab-btn');
        const panels = parent.querySelectorAll('.tab-panel');
        btns.forEach(b => b.setAttribute('aria-selected', 'false'));
        panels.forEach(p => p.setAttribute('aria-hidden', 'true'));
        this.setAttribute('aria-selected', 'true');
        const idx = this.dataset.index;
        document.getElementById(`exp-panel-${idx}`).setAttribute('aria-hidden', 'false');
      });
    });
  }

  function renderProjects() {
    const container = document.getElementById('projects');
    const projs = resume.projects;
    let html = `<div class="section" id="projects-anchor"><div class="section-title">📁 项目经历</div><div class="grid-2">`;
    projs.forEach(p => {
      html += `
        <div class="card">
          <div class="card-header"><span class="card-title">${p.name}</span><span class="card-meta">${p.period}</span></div>
          <div class="card-sub" style="margin-bottom:4px;">🛠 ${p.tech}</div>
          <p style="font-size:0.9rem;color:var(--text-secondary);margin-top:6px;">${p.desc}</p>
        </div>
      `;
    });
    html += `</div></div>`;
    container.innerHTML = html;
  }

  function renderSkills() {
    const container = document.getElementById('skills');
    const skills = resume.skills;
    let html = `<div class="section" id="skills-anchor"><div class="section-title">🧩 技能矩阵</div>`;
    skills.forEach(s => {
      html += `
        <div class="skill-row">
          <span class="skill-name">${s.name}</span>
          <div class="skill-bar"><div class="skill-fill" style="width:${s.level}%;"></div></div>
          <span class="skill-label">${s.level}%</span>
        </div>
      `;
    });
    html += `<div class="badge-group mt-2">${resume.tags.map(t => `<span class="badge">${t}</span>`).join('')}</div>`;
    html += `</div>`;
    container.innerHTML = html;
  }

  function renderEducation() {
    const container = document.getElementById('education');
    const edu = resume.education;
    const awards = resume.awards;
    let html = `<div class="section" id="education-anchor"><div class="section-title">🎓 教育与证书</div>`;
    edu.forEach(e => {
      html += `<div style="display:flex;justify-content:space-between;flex-wrap:wrap;border-bottom:1px solid var(--border);padding:8px 0;"><span><strong>${e.school}</strong> ${e.major}</span><span style="color:var(--text-secondary);font-size:0.85rem;">${e.period}</span></div>`;
    });
    html += `<div style="margin-top:16px;"><div style="font-weight:500;margin-bottom:6px;">🏅 获奖与证书</div><div class="badge-group">`;
    awards.forEach(a => html += `<span class="badge badge-primary">${a}</span>`);
    html += `</div></div></div>`;
    container.innerHTML = html;
  }

  function renderGallery() {
    const container = document.getElementById('gallery');
    const images = resume.galleryImages;
    if (!images || images.length === 0) {
      container.innerHTML = '';
      return;
    }
    let html = `<div class="section" id="gallery-anchor"><div class="section-title">🖼️ 作品集 · 证书</div><div class="gallery">`;
    images.forEach(src => {
      html += `
        <div class="gallery-item">
          <img src="${src}" alt="${src}" loading="lazy" onerror="this.style.display='none';this.parentElement.innerHTML='<span class=\\'placeholder\\'>📄 ${src}</span>'">
        </div>
      `;
    });
    html += `</div></div>`;
    container.innerHTML = html;
  }

  // 全量渲染
  function renderAll() {
    renderHero();
    renderHighlights();
    renderExperience();
    renderProjects();
    renderSkills();
    renderEducation();
    renderGallery();
  }

  // ---------- 交互 ----------
  function copyEmail() {
    const email = resume.email;
    navigator.clipboard?.writeText(email).then(() => {
      alert('邮箱已复制 📧');
    }).catch(() => {
      const inp = document.createElement('input');
      inp.value = email;
      document.body.appendChild(inp);
      inp.select();
      document.execCommand('copy');
      inp.remove();
      alert('邮箱已复制 📧');
    });
  }

  function toggleTheme() {
    const html = document.documentElement;
    const current = html.getAttribute('data-theme');
    html.setAttribute('data-theme', current === 'dark' ? 'light' : 'dark');
    localStorage.setItem('theme', current === 'dark' ? 'light' : 'dark');
  }

  document.getElementById('printBtn')?.addEventListener('click', () => window.print());
  document.getElementById('themeToggle')?.addEventListener('click', toggleTheme);
  const saved = localStorage.getItem('theme');
  if (saved) document.documentElement.setAttribute('data-theme', saved);
  else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
    document.documentElement.setAttribute('data-theme', 'dark');
  }

  document.addEventListener('keydown', function(e) {
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
      const active = document.activeElement;
      if (active && active.classList.contains('tab-btn')) {
        const parent = active.closest('.section');
        if (!parent) return;
        const btns = Array.from(parent.querySelectorAll('.tab-btn'));
        const idx = btns.indexOf(active);
        if (idx === -1) return;
        let newIdx = idx;
        if (e.key === 'ArrowRight') newIdx = Math.min(idx+1, btns.length-1);
        else newIdx = Math.max(idx-1, 0);
        if (newIdx !== idx) {
          e.preventDefault();
          btns[newIdx].click();
          btns[newIdx].focus();
        }
      }
    }
  });

  renderAll();
</script>
</body>
</html>
